name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42t64

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: imagick, ffi
          tools: composer:v2

      - name: Use craft-kit from Packagist
        run: composer config --unset repositories

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: |
          composer update parallelogram/craft-kit --no-interaction --no-progress --no-install
          composer install --no-interaction --no-progress

      - name: Install latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Format
        run: vendor/bin/mago fmt --check

      - name: Lint
        run: vendor/bin/mago lint

      - name: Analyse
        run: vendor/bin/mago analyze

      - name: Test
        run: vendor/bin/phpunit --path-coverage --coverage-clover coverage.xml
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage
        if: matrix.php == '8.3' && matrix.dependencies == 'locked'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
